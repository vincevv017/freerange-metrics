<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="t d">
<title id="t">How it works</title>
<desc id="d">Four steps. 1, declare: the metric contract, the only hand-written source. 2, compile: the compiler validates the contract and writes files into generated/ (two procedures, semantic views, and the views they read, data metric functions, the agent's definition: instructions, tool descriptions, reference questions); it makes no Snowflake call. 3, deploy: a script runs the generated files in Snowflake. 4, in Snowflake: the Cortex Agent picks the parameters and calls STOCK_COVERAGE and CLOSING_STOCK or the semantic view, which read the seven data tables (loaded from the published dataset, not generated); it gets back a figure, a warning or a coded refusal. Data metric functions check the tables, in no answer's path. The evaluation harness, eval/ in the repository, asks the agent each reference question and grades the answer; it is not Snowflake's agent evaluations.</desc>
<metadata id="figure-data">{"agent": "generated/agent_c_raw.yaml", "custom_dmfs": 17, "procedures": ["STOCK_COVERAGE", "CLOSING_STOCK"], "reference_questions": 31, "semantic_views": ["LINKML_C_RAW_SV"], "tables": ["DIM_CALENDAR", "DIM_GEO", "DIM_ITEM", "DIM_WAREHOUSE", "DIM_BATCH", "FCT_STOCK_SNAPSHOT", "FCT_FORECAST"]}</metadata>
<style>@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url('../../assets/fonts/SpaceGrotesk-Variable.ttf')}text{font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif}</style>
<rect x="0" y="0" width="1280" height="930" rx="0" fill="#F5F3FF"/>
<text x="40" y="66" font-size="40" font-weight="700" fill="#110C2A" text-anchor="start">How it works</text><text x="40" y="104" font-size="22" font-weight="400" fill="#4B4470" text-anchor="start">Declared once, compiled into files, deployed by a script, called by the agent.</text><text x="40" y="176" font-size="18" font-weight="700" fill="#F04A1E" text-anchor="start" letter-spacing="1.6">1 · DECLARE</text><rect x="40" y="196" width="190" height="240" rx="14" fill="#FFFFFF" stroke="#9B7BFF" stroke-width="3"/><text x="135" y="263.3" font-size="21" font-weight="700" fill="#110C2A" text-anchor="middle">Metric contract</text><text x="135" y="288.5" font-size="16" font-weight="400" fill="#4B4470" text-anchor="middle">YAML, on a LinkML</text><text x="135" y="310.1" font-size="16" font-weight="400" fill="#4B4470" text-anchor="middle">schema: grains,</text><text x="135" y="331.7" font-size="16" font-weight="400" fill="#4B4470" text-anchor="middle">additivity, the gap</text><text x="135" y="353.3" font-size="16" font-weight="400" fill="#4B4470" text-anchor="middle">rule, refusals,</text><text x="135" y="374.9" font-size="16" font-weight="400" fill="#4B4470" text-anchor="middle">quality</text><text x="40" y="472" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">The only hand-written</text><text x="40" y="492.25" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">source of the generated</text><text x="40" y="512.5" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">files. Git is their system</text><text x="40" y="532.75" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">of record.</text><text x="270" y="176" font-size="18" font-weight="700" fill="#F04A1E" text-anchor="start" letter-spacing="1.6">2 · COMPILE</text><rect x="270" y="196" width="200" height="150" rx="14" fill="#110C2A"/><text x="370" y="227.35" font-size="24" font-weight="700" fill="#FFF7E8" text-anchor="middle">Compiler</text><text x="370" y="252.55" font-size="16" font-weight="400" fill="#FFF7E8" text-anchor="middle">validates the</text><text x="370" y="274.15" font-size="16" font-weight="400" fill="#FFF7E8" text-anchor="middle">contract, writes the</text><text x="370" y="295.75" font-size="16" font-weight="400" fill="#FFF7E8" text-anchor="middle">files</text><text x="370" y="322.65" font-size="14" font-weight="500" fill="#C9BEFF" text-anchor="middle">no Snowflake call</text><line x1="230" y1="271" x2="260" y2="271" stroke="#9B7BFF" stroke-width="3"/><path d="M258 262 L258 280 L270 271 Z" fill="#9B7BFF"/><line x1="370" y1="346" x2="370" y2="390" stroke="#9B7BFF" stroke-width="3"/><path d="M361 388 L379 388 L370 400 Z" fill="#9B7BFF"/><text x="382" y="378" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">writes</text><rect x="270" y="400" width="200" height="268" rx="14" fill="#FFF7E8"/><text x="370" y="434" font-size="19" font-weight="700" fill="#110C2A" text-anchor="middle">Files in generated/</text><text x="286" y="466" font-size="15" font-weight="700" fill="#F04A1E" text-anchor="start">·</text><text x="298" y="466" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">two procedures</text><text x="286" y="497.5" font-size="15" font-weight="700" fill="#F04A1E" text-anchor="start">·</text><text x="298" y="497.5" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">semantic views, and</text><text x="298" y="517" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">the views they read</text><text x="286" y="548.5" font-size="15" font-weight="700" fill="#F04A1E" text-anchor="start">·</text><text x="298" y="548.5" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">data metric functions</text><text x="286" y="580" font-size="15" font-weight="700" fill="#F04A1E" text-anchor="start">·</text><text x="298" y="580" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">the agent's definition:</text><text x="298" y="599.5" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">instructions, tool</text><text x="298" y="619" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">descriptions</text><text x="286" y="650.5" font-size="15" font-weight="700" fill="#F04A1E" text-anchor="start">·</text><text x="298" y="650.5" font-size="15" font-weight="400" fill="#110C2A" text-anchor="start">reference questions</text><text x="510" y="176" font-size="18" font-weight="700" fill="#F04A1E" text-anchor="start" letter-spacing="1.6">EVALUATION</text><rect x="510" y="196" width="200" height="200" rx="14" fill="#FFFFFF" stroke="#C9BEFF" stroke-width="2"/><text x="610" y="225.525" font-size="18" font-weight="700" fill="#110C2A" text-anchor="middle">Evaluation harness</text><text x="610" y="249.775" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">eval/ in the</text><text x="610" y="270.025" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">repository: asks the</text><text x="610" y="290.275" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">agent each reference</text><text x="610" y="310.525" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">question and grades</text><text x="610" y="330.775" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">the answer.</text><text x="610" y="351.025" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">Not Snowflake's agent</text><text x="610" y="371.275" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">evaluations.</text><polyline points="470,440 610,440 610,408" fill="none" stroke="#9B7BFF" stroke-width="3"/><path d="M601 408 L619 408 L610 396 Z" fill="#9B7BFF"/><text x="622" y="430" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">read by</text><text x="510" y="490" font-size="18" font-weight="700" fill="#F04A1E" text-anchor="start" letter-spacing="1.6">3 · DEPLOY</text><rect x="510" y="510" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#9B7BFF" stroke-width="2"/><text x="610" y="540.025" font-size="18" font-weight="700" fill="#110C2A" text-anchor="middle">Deploy script</text><text x="610" y="564.275" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">runs the generated</text><text x="610" y="584.525" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">files in Snowflake, as</text><text x="610" y="604.775" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">the project role</text><line x1="470" y1="570" x2="500" y2="570" stroke="#9B7BFF" stroke-width="3"/><path d="M498 561 L498 579 L510 570 Z" fill="#9B7BFF"/><rect x="770" y="150" width="470" height="630" rx="22" fill="#E9E4FF"/><text x="790" y="182" font-size="18" font-weight="700" fill="#F04A1E" text-anchor="start" letter-spacing="1.6">4 · IN SNOWFLAKE</text><rect x="790" y="196" width="430" height="120" rx="14" fill="#110C2A"/><text x="1005" y="221.125" font-size="24" font-weight="700" fill="#FFF7E8" text-anchor="middle">Cortex Agent</text><text x="1005" y="247.275" font-size="17" font-weight="400" fill="#FFF7E8" text-anchor="middle">picks the parameters, gets back a figure, a</text><text x="1005" y="270.225" font-size="17" font-weight="400" fill="#FFF7E8" text-anchor="middle">warning or a coded refusal</text><text x="1005" y="298.475" font-size="15" font-weight="500" fill="#C9BEFF" text-anchor="middle">its definition is generated</text><line x1="710" y1="261" x2="780" y2="261" stroke="#9B7BFF" stroke-width="3"/><path d="M778 252 L778 270 L790 261 Z" fill="#9B7BFF"/><text x="720" y="250" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">asks</text><line x1="710" y1="570" x2="760" y2="570" stroke="#9B7BFF" stroke-width="3"/><path d="M758 561 L758 579 L770 570 Z" fill="#9B7BFF"/><text x="718" y="594" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">creates</text><rect x="790" y="372" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#F04A1E" stroke-width="3"/><text x="925" y="407.2" font-size="19" font-weight="700" fill="#110C2A" text-anchor="middle">Two procedures</text><text x="925" y="431.45" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">STOCK_COVERAGE: coverage</text><text x="925" y="451.7" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">CLOSING_STOCK: closing stock</text><text x="925" y="471.95" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">compute and warn,</text><text x="925" y="492.2" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">or refuse with a code</text><rect x="1075" y="372" width="145" height="150" rx="14" fill="#FFFFFF" stroke="#C9BEFF" stroke-width="2"/><text x="1147.5" y="406.6" font-size="17" font-weight="700" fill="#110C2A" text-anchor="middle">Semantic view</text><text x="1147.5" y="430.85" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">stock on hand</text><text x="1147.5" y="451.1" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">and forecast,</text><text x="1147.5" y="471.35" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">on the raw</text><text x="1147.5" y="491.6" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">tables</text><line x1="925" y1="316" x2="925" y2="362" stroke="#9B7BFF" stroke-width="3"/><path d="M916 360 L934 360 L925 372 Z" fill="#9B7BFF"/><line x1="1147.5" y1="316" x2="1147.5" y2="362" stroke="#9B7BFF" stroke-width="3"/><path d="M1138.5 360 L1156.5 360 L1147.5 372 Z" fill="#9B7BFF"/><text x="937" y="348" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">calls</text><line x1="925" y1="522" x2="925" y2="556" stroke="#9B7BFF" stroke-width="3"/><path d="M916 554 L934 554 L925 566 Z" fill="#9B7BFF"/><line x1="1147.5" y1="522" x2="1147.5" y2="556" stroke="#9B7BFF" stroke-width="3"/><path d="M1138.5 554 L1156.5 554 L1147.5 566 Z" fill="#9B7BFF"/><text x="937" y="550" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">read</text><rect x="790" y="566" width="430" height="64" rx="14" fill="none" stroke="#4B4470" stroke-width="2" stroke-dasharray="7 6"/><text x="1005" y="588.275" font-size="18" font-weight="700" fill="#110C2A" text-anchor="middle">Seven tables</text><text x="1005" y="612.525" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">loaded from the published dataset, not generated</text><rect x="790" y="674" width="430" height="90" rx="14" fill="#FFFFFF" stroke="#C9BEFF" stroke-width="2"/><text x="1005" y="699.15" font-size="18" font-weight="700" fill="#110C2A" text-anchor="middle">Data metric functions</text><text x="1005" y="723.4" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">check the tables when a script runs them; in no</text><text x="1005" y="743.65" font-size="15" font-weight="400" fill="#4B4470" text-anchor="middle">answer's path</text><line x1="1005" y1="674" x2="1005" y2="640" stroke="#9B7BFF" stroke-width="3"/><path d="M996 642 L1014 642 L1005 630 Z" fill="#9B7BFF"/><text x="1017" y="658" font-size="15" font-weight="400" fill="#4B4470" text-anchor="start">check</text><text x="40" y="840" font-size="30" font-weight="700" fill="#110C2A" text-anchor="start">The LLM picks parameters. It never computes the metric.</text><text x="40" y="878" font-size="16" font-weight="400" fill="#4B4470" text-anchor="start">Not generated: the seven data tables, loaded from the published dataset, and the database, role and warehouse, created once by a setup script. Worked</text><text x="40" y="899.6" font-size="16" font-weight="400" fill="#4B4470" text-anchor="start">example: retail stock coverage.</text>
</svg>
