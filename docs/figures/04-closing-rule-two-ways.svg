<title id="t">Two ways to apply the closing rule</title>
<desc id="d">Left, a gap-filled view recomputed at every query: 4.1% more rows (63,428 for 60,915), a quarter question scans the table 2.0 times (measured); it grows with each member's span (inferred). Right, a procedure at question time: the same closing stock on 12,304 of 12,304 members, about 5 s of compilation per call (measured); it grows with the rows of the period asked (inferred).</desc>
