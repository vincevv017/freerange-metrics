    configuration: B1
    question_id: CS_LAST_MONTH_GAP
    verdict: correct
    rule: WRONG_VALUE_CITED_AS_HISTORY
    reason: >-
      The answer gives 0 as the Q2 2026 closing stock of SKU-H11 in Switzerland and cites 400 (April) and 350 (May) as
      the stock held earlier in the quarter, then states that the item closes at 0. 350 is the history of May, not
      the answer.
    decided_by: project owner
