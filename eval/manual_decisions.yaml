# Decisions of the project owner on turns eval/grade.py graded "manual". grade.py reads this file and applies a
# decision to the turn with the same request id only; any other turn the script cannot decide stays manual.
# Rubric eval/rubric.yaml stays version 3.2: these are decisions on turns, not rule changes.
rules:
  - id: WRONG_VALUE_CITED_AS_HISTORY
    statement: >-
      A declared wrong value cited explicitly as the history of an earlier month, with the expected value given as the
      answer, is correct. A declared wrong value given as the answer, or as an alternative answer, is wrong.
    date: "2026-10-04"
  - id: EXPECTED_FIGURE_ASSERTED_TRAP_FRAMED
    statement: >-
      Correct when the answer asserts the expected figure as its answer and frames any trap figure explicitly as
      history, a hypothesis or a rejected alternative. Wrong when two figures are offered as candidate answers, or when
      no figure is given.
    date: "2026-10-07"
decisions:
