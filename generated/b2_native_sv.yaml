    \ / (fwd.cum_value_17 - fwd.cum_value_16)\n  WHEN stock.closing_stock_value <= fwd.cum_value_18 THEN 17 + (stock.closing_stock_value\
    \ - fwd.cum_value_17) / (fwd.cum_value_18 - fwd.cum_value_17)\n  WHEN stock.closing_stock_value <= fwd.cum_value_19\
    \ THEN 18 + (stock.closing_stock_value - fwd.cum_value_18) / (fwd.cum_value_19 - fwd.cum_value_18)\n  WHEN stock.closing_stock_value\
    \ <= fwd.cum_value_20 THEN 19 + (stock.closing_stock_value - fwd.cum_value_19) / (fwd.cum_value_20 - fwd.cum_value_19)\n\
    \  WHEN stock.closing_stock_value <= fwd.cum_value_21 THEN 20 + (stock.closing_stock_value - fwd.cum_value_20) / (fwd.cum_value_21\
    \ - fwd.cum_value_20)\n  WHEN stock.closing_stock_value <= fwd.cum_value_22 THEN 21 + (stock.closing_stock_value - fwd.cum_value_21)\
    \ / (fwd.cum_value_22 - fwd.cum_value_21)\n  WHEN stock.closing_stock_value <= fwd.cum_value_23 THEN 22 + (stock.closing_stock_value\
    \ - fwd.cum_value_22) / (fwd.cum_value_23 - fwd.cum_value_22)\n  WHEN stock.closing_stock_value <= fwd.cum_value_24\
    \ THEN 23 + (stock.closing_stock_value - fwd.cum_value_23) / (fwd.cum_value_24 - fwd.cum_value_23)\n  ELSE stock.closing_stock_value\
    \ / (fwd.cum_value_24 / (IFF(fwd.month_value_01 > 0, 1, 0) + IFF(fwd.month_value_02 > 0, 1, 0) + IFF(fwd.month_value_03\
    \ > 0, 1, 0) + IFF(fwd.month_value_04 > 0, 1, 0) + IFF(fwd.month_value_05 > 0, 1, 0) + IFF(fwd.month_value_06 > 0, 1,\
    \ 0) + IFF(fwd.month_value_07 > 0, 1, 0) + IFF(fwd.month_value_08 > 0, 1, 0) + IFF(fwd.month_value_09 > 0, 1, 0) + IFF(fwd.month_value_10\
    \ > 0, 1, 0) + IFF(fwd.month_value_11 > 0, 1, 0) + IFF(fwd.month_value_12 > 0, 1, 0) + IFF(fwd.month_value_13 > 0, 1,\
    \ 0) + IFF(fwd.month_value_14 > 0, 1, 0) + IFF(fwd.month_value_15 > 0, 1, 0) + IFF(fwd.month_value_16 > 0, 1, 0) + IFF(fwd.month_value_17\
    \ > 0, 1, 0) + IFF(fwd.month_value_18 > 0, 1, 0) + IFF(fwd.month_value_19 > 0, 1, 0) + IFF(fwd.month_value_20 > 0, 1,\
    \ 0) + IFF(fwd.month_value_21 > 0, 1, 0) + IFF(fwd.month_value_22 > 0, 1, 0) + IFF(fwd.month_value_23 > 0, 1, 0) + IFF(fwd.month_value_24\
    \ > 0, 1, 0)))\nEND"
verified_queries:
- name: closing_stock_family_country_quarter
  question: What was the closing stock of family SNACK_CRISPS in DE for 2026-Q1, in kg equivalent?
  sql: '-- closing stock of a quarter = the snapshot of its last month (2026-03-01), absent = 0 (gap-filled)

    SELECT i.family_code, g.country_code, SUM(s.stock_qty_eq) AS closing_stock_qty_eq

    FROM __stock AS s

    JOIN __item AS i ON s.item_id = i.item_id

    JOIN __geo AS g ON s.country_id = g.country_id

    WHERE i.family_code = ''SNACK_CRISPS'' AND g.country_code = ''DE'' AND s.snapshot_month = ''2026-03-01''

    GROUP BY i.family_code, g.country_code'
- name: forecast_family_country_month
  question: What is the demand forecast of family PANTRY_RICE in IT for 2026-08, in kg equivalent?
  sql: 'SELECT i.family_code, g.country_code, SUM(f.forecast_qty_eq) AS forecast_qty_eq

    FROM __forecast AS f

    JOIN __item AS i ON f.item_id = i.item_id

    JOIN __geo AS g ON f.country_id = g.country_id

    WHERE i.family_code = ''PANTRY_RICE'' AND g.country_code = ''IT'' AND f.forecast_month = ''2026-08-01''

    GROUP BY i.family_code, g.country_code'
