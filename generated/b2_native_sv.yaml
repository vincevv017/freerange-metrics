    \ - fwd.cum_value_07) / (fwd.cum_value_08 - fwd.cum_value_07)\n  WHEN stock.closing_stock_value <= fwd.cum_value_09\
    \ THEN 8 + (stock.closing_stock_value - fwd.cum_value_08) / (fwd.cum_value_09 - fwd.cum_value_08)\n  WHEN stock.closing_stock_value\
    \ <= fwd.cum_value_10 THEN 9 + (stock.closing_stock_value - fwd.cum_value_09) / (fwd.cum_value_10 - fwd.cum_value_09)\n\
    \  WHEN stock.closing_stock_value <= fwd.cum_value_11 THEN 10 + (stock.closing_stock_value - fwd.cum_value_10) / (fwd.cum_value_11\
    \ - fwd.cum_value_10)\n  WHEN stock.closing_stock_value <= fwd.cum_value_12 THEN 11 + (stock.closing_stock_value - fwd.cum_value_11)\
    \ / (fwd.cum_value_12 - fwd.cum_value_11)\n  WHEN stock.closing_stock_value <= fwd.cum_value_13 THEN 12 + (stock.closing_stock_value\
    \ - fwd.cum_value_12) / (fwd.cum_value_13 - fwd.cum_value_12)\n  WHEN stock.closing_stock_value <= fwd.cum_value_14\
    \ THEN 13 + (stock.closing_stock_value - fwd.cum_value_13) / (fwd.cum_value_14 - fwd.cum_value_13)\n  WHEN stock.closing_stock_value\
    \ <= fwd.cum_value_15 THEN 14 + (stock.closing_stock_value - fwd.cum_value_14) / (fwd.cum_value_15 - fwd.cum_value_14)\n\
    \  WHEN stock.closing_stock_value <= fwd.cum_value_16 THEN 15 + (stock.closing_stock_value - fwd.cum_value_15) / (fwd.cum_value_16\
