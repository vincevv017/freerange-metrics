metrics:
- name: coverage_months_qty_eq
  synonyms:
  - months of cover
  - coverage
  - stock cover
  - months of stock
  description: 'Stock coverage, always in months; stock and forecast measured in kg or L equivalent; kg and L never add
    up: group or filter by dimension when items of both dimensions are combined, or use the value metric: forward depletion
    of the stock at the analysis month t against the forecast of t+1 to t+H. Recomputed from the stock and the forward forecast
    aggregated at the queried grain; never add or average it across rows. Filter calendar.month_start on exactly one analysis
    month. Outcomes: NO_STOCK: Forecast but no stock at the analysis month, coverage 0; the row is kept.; NO_DEMAND: No
    forecast in the window t+1 to t+H, coverage null: undefined without demand.; BEYOND_HORIZON: Stock outlasts the 24-month
    horizon, extrapolated: stock over the mean non-zero monthly forecast of the horizon.'
  expr: "CASE\n  WHEN stock.closing_stock_qty_eq IS NULL OR stock.closing_stock_qty_eq = 0 THEN 0\n  WHEN fwd.cum_qty_eq_24\
    \ IS NULL OR fwd.cum_qty_eq_24 = 0 THEN NULL\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_01 THEN stock.closing_stock_qty_eq\
    \ / fwd.cum_qty_eq_01\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_02 THEN 1 + (stock.closing_stock_qty_eq -\
    \ fwd.cum_qty_eq_01) / (fwd.cum_qty_eq_02 - fwd.cum_qty_eq_01)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_03\
    \ THEN 2 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_02) / (fwd.cum_qty_eq_03 - fwd.cum_qty_eq_02)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_04 THEN 3 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_03) / (fwd.cum_qty_eq_04 - fwd.cum_qty_eq_03)\n\
    \  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_05 THEN 4 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_04) /\
    \ (fwd.cum_qty_eq_05 - fwd.cum_qty_eq_04)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_06 THEN 5 + (stock.closing_stock_qty_eq\
    \ - fwd.cum_qty_eq_05) / (fwd.cum_qty_eq_06 - fwd.cum_qty_eq_05)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_07\
    \ THEN 6 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_06) / (fwd.cum_qty_eq_07 - fwd.cum_qty_eq_06)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_08 THEN 7 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_07) / (fwd.cum_qty_eq_08 - fwd.cum_qty_eq_07)\n\
    \  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_09 THEN 8 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_08) /\
    \ (fwd.cum_qty_eq_09 - fwd.cum_qty_eq_08)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_10 THEN 9 + (stock.closing_stock_qty_eq\
    \ - fwd.cum_qty_eq_09) / (fwd.cum_qty_eq_10 - fwd.cum_qty_eq_09)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_11\
    \ THEN 10 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_10) / (fwd.cum_qty_eq_11 - fwd.cum_qty_eq_10)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_12 THEN 11 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_11) / (fwd.cum_qty_eq_12 - fwd.cum_qty_eq_11)\n\
    \  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_13 THEN 12 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_12) /\
    \ (fwd.cum_qty_eq_13 - fwd.cum_qty_eq_12)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_14 THEN 13 + (stock.closing_stock_qty_eq\
    \ - fwd.cum_qty_eq_13) / (fwd.cum_qty_eq_14 - fwd.cum_qty_eq_13)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_15\
    \ THEN 14 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_14) / (fwd.cum_qty_eq_15 - fwd.cum_qty_eq_14)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_16 THEN 15 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_15) / (fwd.cum_qty_eq_16 - fwd.cum_qty_eq_15)\n\
    \  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_17 THEN 16 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_16) /\
    \ (fwd.cum_qty_eq_17 - fwd.cum_qty_eq_16)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_18 THEN 17 + (stock.closing_stock_qty_eq\
    \ - fwd.cum_qty_eq_17) / (fwd.cum_qty_eq_18 - fwd.cum_qty_eq_17)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_19\
    \ THEN 18 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_18) / (fwd.cum_qty_eq_19 - fwd.cum_qty_eq_18)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_20 THEN 19 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_19) / (fwd.cum_qty_eq_20 - fwd.cum_qty_eq_19)\n\
    \  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_21 THEN 20 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_20) /\
    \ (fwd.cum_qty_eq_21 - fwd.cum_qty_eq_20)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_22 THEN 21 + (stock.closing_stock_qty_eq\
    \ - fwd.cum_qty_eq_21) / (fwd.cum_qty_eq_22 - fwd.cum_qty_eq_21)\n  WHEN stock.closing_stock_qty_eq <= fwd.cum_qty_eq_23\
    \ THEN 22 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_22) / (fwd.cum_qty_eq_23 - fwd.cum_qty_eq_22)\n  WHEN stock.closing_stock_qty_eq\
    \ <= fwd.cum_qty_eq_24 THEN 23 + (stock.closing_stock_qty_eq - fwd.cum_qty_eq_23) / (fwd.cum_qty_eq_24 - fwd.cum_qty_eq_23)\n\
    \  ELSE stock.closing_stock_qty_eq / (fwd.cum_qty_eq_24 / (IFF(fwd.month_qty_eq_01 > 0, 1, 0) + IFF(fwd.month_qty_eq_02\
    \ > 0, 1, 0) + IFF(fwd.month_qty_eq_03 > 0, 1, 0) + IFF(fwd.month_qty_eq_04 > 0, 1, 0) + IFF(fwd.month_qty_eq_05 > 0,\
    \ 1, 0) + IFF(fwd.month_qty_eq_06 > 0, 1, 0) + IFF(fwd.month_qty_eq_07 > 0, 1, 0) + IFF(fwd.month_qty_eq_08 > 0, 1,\
    \ 0) + IFF(fwd.month_qty_eq_09 > 0, 1, 0) + IFF(fwd.month_qty_eq_10 > 0, 1, 0) + IFF(fwd.month_qty_eq_11 > 0, 1, 0)\
    \ + IFF(fwd.month_qty_eq_12 > 0, 1, 0) + IFF(fwd.month_qty_eq_13 > 0, 1, 0) + IFF(fwd.month_qty_eq_14 > 0, 1, 0) + IFF(fwd.month_qty_eq_15\
    \ > 0, 1, 0) + IFF(fwd.month_qty_eq_16 > 0, 1, 0) + IFF(fwd.month_qty_eq_17 > 0, 1, 0) + IFF(fwd.month_qty_eq_18 > 0,\
    \ 1, 0) + IFF(fwd.month_qty_eq_19 > 0, 1, 0) + IFF(fwd.month_qty_eq_20 > 0, 1, 0) + IFF(fwd.month_qty_eq_21 > 0, 1,\
    \ 0) + IFF(fwd.month_qty_eq_22 > 0, 1, 0) + IFF(fwd.month_qty_eq_23 > 0, 1, 0) + IFF(fwd.month_qty_eq_24 > 0, 1, 0)))\n\
    END"
- name: coverage_months_value
  synonyms: []
  description: 'Stock coverage, always in months; stock and forecast measured in EUR, comparable across every item: forward
    depletion of the stock at the analysis month t against the forecast of t+1 to t+H. Recomputed from the stock and the
