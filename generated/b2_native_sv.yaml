# GENERATED from contract/stock_coverage.yaml (contract stock_coverage, version 0.5.1) and data/output/
# by compiler/gen_native_sv.py. Do not edit: change the contract and run `python compiler/gen_native_sv.py`.
# tests/test_generated.py regenerates this file and fails on any difference.
# Configuration B2: semantic view LINKML_METRICS.RAW.LINKML_B2_SV, deployed after enrichment (snowflake/phase4_others/b2/).
name: LINKML_B2_SV
description: 'Configuration B2, generated from contract stock_coverage 0.5.1: stock coverage, closing stock and demand forecast
  of the grocery dataset.'
tables:
- name: item
  description: 'Items: SKU, family, range, item type and lifecycle status. One row per distinct combination of the item
    key and its attributes; an item recorded twice with different attributes keeps two rows.'
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: B2_ITEM
  primary_key:
    columns:
    - item_id
  dimensions:
  - name: sku_code
    expr: sku_code
    description: 'sku_code (conformed: applies to stock and forecast alike).'
  - name: sku_name
    expr: sku_name
    description: Name of sku_code.
  - name: family_code
    expr: family_code
    description: 'family_code (conformed: applies to stock and forecast alike).'
  - name: family_name
    expr: family_name
    description: Name of family_code.
  - name: range_code
    expr: range_code
    description: 'range_code (conformed: applies to stock and forecast alike).'
  - name: range_name
    expr: range_name
    description: Name of range_code.
  - name: lifecycle_status
    expr: lifecycle_status
    description: 'An item attribute, so the forecast carries it too (decision 6, session 4). Trap T7 duplicates exactly
      this column: QE_ITEM_GRAIN refuses a query that uses it while an item has two values. (conformed: applies to stock
      and forecast alike). Known values: ACTIVE, PHASE_OUT.'
  - name: dimension
    expr: dimension
    description: 'The physical dimension in which the item is counted, with its base unit: MASS (kg) or VOLUME (L). Grouping
      or filtering by it keeps quantity-equivalent rows within one dimension. (conformed: applies to stock and forecast
      alike). Known values: MASS, VOLUME.'
  - name: base_unit
    expr: base_unit
    description: Name of dimension.
  - name: item_type
    expr: item_type
    description: 'Snapshot-only by decision: BULK items carry stock but never a forecast. Default scope STANDARD for stock
      coverage only; closing stock counts every item type. (stock-only: restricts the stock, never the forecast). Known
      values: STANDARD, BULK.'
- name: geo
  description: Countries and regions.
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: DIM_GEO
  primary_key:
    columns:
    - country_id
  dimensions:
  - name: country_code
    expr: country_code
    description: 'ISO 3166-1 alpha-2 code. (conformed: applies to stock and forecast alike).'
  - name: country_name
    expr: country_name
    description: Name of country_code.
  - name: region_code
    expr: region_code
    description: 'region_code (conformed: applies to stock and forecast alike). Known values: CENTRAL, NORDIC, SOUTH, WEST.'
  - name: region_name
    expr: region_name
    description: Name of region_code.
- name: calendar
  description: 'Calendar months. For stock coverage, month_start is the analysis month: filter it on exactly one month.
    For closing stock over a period, filter or group by year_quarter, year or a range of month_start.'
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: DIM_CALENDAR
  primary_key:
    columns:
    - month_start
  dimensions:
  - name: month_start
    expr: month_start
    description: First day of the month (the analysis month for coverage).
    data_type: DATE
  - name: year_quarter
    expr: year || '-Q' || quarter
    description: Calendar quarter, for example 2026-Q2.
  - name: year
    expr: year
    description: Calendar year.
- name: batch
  description: Supplier lots (batches) of the stock.
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: DIM_BATCH
  primary_key:
    columns:
    - batch_id
- name: status
  description: 'Values of batch_status, reached by the stock through its lot and by the forward forecast through its per-status
    replicas: a filter on it restricts the stock only.'
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: B2_STATUS
  primary_key:
    columns:
    - batch_status
  dimensions:
  - name: batch_status
    expr: batch_status
    description: 'batch_status (stock-only: restricts the stock, never the forecast). Known values: RELEASED, QUALITY_HOLD,
      BLOCKED.'
- name: warehouse
  description: Warehouses holding the stock (stock-only attributes).
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: DIM_WAREHOUSE
  primary_key:
    columns:
    - warehouse_id
  dimensions:
  - name: warehouse_code
    expr: warehouse_code
    description: 'warehouse_code (stock-only: restricts the stock, never the forecast).'
  - name: warehouse_type
    expr: warehouse_type
    description: 'warehouse_type (stock-only: restricts the stock, never the forecast). Known values: OWN, 3PL.'
- name: stock
  description: 'Closing stock of the month. A level, never summed over months. Gap-filled: a lot and warehouse with no snapshot
    in a month of its span counts 0 that month.'
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: FCT_STOCK_SNAPSHOT_GAPFILLED
  primary_key:
    columns:
    - snapshot_month
    - batch_id
    - warehouse_id
  dimensions:
  - name: expiry_bucket
    expr: expiry_bucket
    description: 'expiry_bucket (stock-only: restricts the stock, never the forecast). Known values: <6M, 6-12M, 12-24M,
      >24M.'
  - name: snapshot_month
    expr: snapshot_month
    description: Snapshot month of the stock.
    data_type: DATE
  - name: gap_filled
    expr: gap_filled
    description: TRUE on a row added by the gap fill (stock 0).
    data_type: BOOLEAN
  metrics:
  - name: closing_stock_qty_eq
    description: 'Stock on hand in kg or L equivalent; kg and L never add up: group or filter by dimension when items of
      both dimensions are combined, or use the value metric: the snapshot of the latest month in the query, summed over
      items, countries, lots and warehouses. Closing stock over a period: the snapshot of the period''s last month, for
      every member of the period. A member with a snapshot in any month of the period and none in its last month closes
      at 0 and keeps its row. Never summed, averaged or carried forward over time (step 1 of the article; data/traps.yaml
      closing_stock). Never sum, average, last_non_empty over time. For coverage it is the stock at the analysis month.'
    expr: SUM(stock_qty_eq)
    non_additive_dimensions:
    - table: stock
      dimension: snapshot_month
      sort_direction: ascending
      null_order: last
  - name: closing_stock_value
    description: 'Stock on hand in EUR, comparable across every item: the snapshot of the latest month in the query, summed
      over items, countries, lots and warehouses. Closing stock over a period: the snapshot of the period''s last month,
      for every member of the period. A member with a snapshot in any month of the period and none in its last month closes
      at 0 and keeps its row. Never summed, averaged or carried forward over time (step 1 of the article; data/traps.yaml
      closing_stock). Never sum, average, last_non_empty over time. For coverage it is the stock at the analysis month.'
    expr: SUM(stock_value_eur)
    non_additive_dimensions:
    - table: stock
      dimension: snapshot_month
      sort_direction: ascending
      null_order: last
- name: forecast
  description: Monthly demand forecast per item and country. A flow, summed over the forward window.
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: FCT_FORECAST
  primary_key:
    columns:
    - forecast_month
    - item_id
    - country_id
  dimensions:
  - name: forecast_month
    expr: forecast_month
    description: Forecast month.
    data_type: DATE
  metrics:
  - name: forecast_qty_eq
    description: 'Monthly demand forecast per item and country. A flow, summed over the forward window. Summed over the
      months, items and countries of the query, in kg or L equivalent; kg and L never add up: group or filter by dimension
      when items of both dimensions are combined, or use the value metric.'
    expr: SUM(forecast_qty_eq)
  - name: forecast_value
    description: Monthly demand forecast per item and country. A flow, summed over the forward window. Summed over the months,
      items and countries of the query, in EUR, comparable across every item.
    expr: SUM(forecast_value_eur)
- name: fwd
  description: 'Forward forecast spine: for each valid analysis month, the forecast of the 24 following months by item and
    country, missing months 0, replicated once per batch_status value (every metric divides the replication back out). Used
    by the coverage metrics only.'
  base_table:
    database: LINKML_METRICS
    schema: RAW
    table: B2_FORECAST_SPINE
  primary_key:
    columns:
    - as_of_month
    - item_id
    - country_id
    - batch_status
