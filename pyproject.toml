[project]
name = "linkml-metrics"
version = "0.0.1"
description = "Stock coverage declared in a LinkML contract, generated and tested in Snowflake"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "duckdb>=1.1",
    "snowflake-connector-python[pandas]>=3.12",
    "linkml>=1.9",
    "requests>=2.32",
    "PyJWT>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The owner's value-grounding tool for B1 and B2 (not published, never copied here; session 8).
tools = ["ruamel.yaml>=0.18", "python-dotenv>=1.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
