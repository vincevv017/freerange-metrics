# Session 9b (owner, 2026-10-07): three questions added in stage 2, asked of C and B2 only (added_in_stage: 2 in the
# generated file). Never asked in stage 1, never seen by a frozen agent. Existing data, no new fact, analysis month June
# 2026, default scope (STANDARD stock) for coverage, every item type for closing stock (DEFINITION.md sections 1, 7 and
# 8). Wording verbatim from the owner. N2 was reworded by the owner to the months of Q2 2026 (2026-10-07): the SNACK_BARS
# family holds no stock in Switzerland before April 2026, so for Q3 2025, Q4 2025 and Q1 2026 both references return no
# row and section 7 defines no closing stock. Values computed by the two references of data/coverage_ref.py (closing
# stock: closing_stock and sql_closing_stock; coverage: py_rows + select and sql_rows + sql_select, which agree;
# tests/test_reference_oracle.py recomputes every one and every wrong value), never by the procedure (D040).
# expected_route: the route agent C is expected to take. both: the procedure and the closing-stock view, each called at
# least once in the turn; B2 answers both halves from its view.
stage2_questions:
  - id: N1
    question: "What was the closing stock of SKU-H11 in Switzerland at the end of Q2 2026, and how many months of stock coverage does it have as of June 2026?"
    expected_route: both
    closing_stock:                                    # as CS_LAST_MONTH_GAP: no snapshot in June, the last month
      query: {grain: [sku_code, country_code], filters: {sku_code: SKU-H11, country_code: CH}, period_k: [-2, 0]}
      expected: 0.0
      wrong: {sum_over_period: 750.0, last_known_value: 350.0, average_over_period: 250.0}
    coverage:                                         # as T9: no stock at the analysis month
      query: {grain: [sku_code, country_code], filters: {sku_code: SKU-H11, country_code: CH}}
      expected: 0.0
      expected_flag: NO_STOCK
      wrong: {last_known_stock_over_forecast: 3.5}
  - id: N2
    question: "For the SNACK_BARS family in Switzerland, what was the closing stock at the end of each month of Q2 2026, and how many months of coverage does the June 2026 stock give?"
    expected_route: both
    closing_stock:
      # Each month is its own period. April: H11 400 + H12 500. May: H11 350, H12 has no snapshot (gap). June: H12 450,
      # H11 has none. Carried at the last known value per item: May 350 + 500, June 350 + 450.
      query: {grain: [family_code, country_code], filters: {family_code: SNACK_BARS, country_code: CH}, months_k: [-2, -1, 0]}
      expected_by_month: {"2026-04-01": 900.0, "2026-05-01": 350.0, "2026-06-01": 450.0}
      wrong_by_month:
        last_known_value_per_sku: {"2026-05-01": 850.0, "2026-06-01": 800.0}
      wrong_over_months: {sum_over_period: 1700.0, average_over_period: 566.6666666666666}   # the months added or averaged
    coverage:
      # S = 450 (H12), f = 100 + 100 = 200/month. C(2) = 400, C(3) = 600 -> 2 + 50/200 = 2.25.
      # June carried at the last known value: 800 against 200/month -> 4.0.
      # No re-aggregation trap is declared: the children are H11 0 (no stock) and H12 450/100 -> 4.5; their mean is
      # 2.25, the expected value, and their sum and stock-weighted mean are 4.5, H12's own coverage, which an answer may
      # cite. Each would grade a correct answer, or a cited child, as a wrong value.
      query: {grain: [family_code, country_code], filters: {family_code: SNACK_BARS, country_code: CH}}
      expected: 2.25
      wrong: {last_known_stock_over_forecast: 4.0}
  - id: N3
    question: "Which products will run out of stock first in France, as of June 2026?"
    expected_route: coverage
    # D051: the 10 lowest coverages above 0 at item grain within France, lowest first, ties by the product codes; items
    # already out of stock and items with no demand are set apart and counted, not ranked (none in France under the
    # default scope). Graded on the exact item set (rubric 3.2, item_set). No tie at the tenth place (6.217 against 6.741).
    query: {grain: [sku_code], filters: {country_code: FR}, basis: QTY_EQ, rank_first: 10}
    graded_on: item_set
    expected_rows:
      - [SKU-H02, 0.5, kg, "2026-07-01"]
      - [SKU-0039, 1.0124223602484472, kg, "2026-08-01"]
      - [SKU-0031, 1.8432835820895521, L, "2026-08-01"]
      - [SKU-0010, 2.2094972067039107, kg, "2026-09-01"]
      - [SKU-0008, 3.1333333333333333, kg, "2026-10-01"]
      - [SKU-0033, 3.3575851393188856, kg, "2026-10-01"]
      - [SKU-0027, 4.428571428571429, L, "2026-11-01"]
      - [SKU-0016, 4.462603878116344, kg, "2026-11-01"]
      - [SKU-0024, 5.962962962962963, L, "2026-12-01"]
      - [SKU-0021, 6.217054263565892, kg, "2027-01-01"]
    expected_summary: {count: 10, stock: [{unit: L, amount: 44302.0}, {unit: kg, amount: 59757.5}]}
    expected_apart: {NO_STOCK: [], NO_DEMAND: []}
    wrong:
      naive_mean_ratio: [SKU-H02, SKU-0039, SKU-0010, SKU-0031, SKU-0027, SKU-0008, SKU-0033, SKU-0016, SKU-0045, SKU-0021]
      stockout_within_3_months: [SKU-H02, SKU-0039, SKU-0031, SKU-0010]   # the S_STOCKOUT_COUNTRY list
      bulk_counted_apart: SKU-0015          # the default scope not applied: a BULK item set apart as NO_DEMAND
