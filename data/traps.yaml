# Session 8c, step 2: the held-out hard questions (owner's three, plus one where a model that computes the cascade itself
# is likely to go wrong). Not asked in stage 1 of the campaign; asked in stage 2 only (held_out: true in the generated
# file). Existing data, no new fact, analysis month June 2026, default scope (STANDARD stock). Values computed by the two
# references of data/coverage_ref.py (py_rows + select, sql_rows + sql_select, which agree; tests/test_reference_oracle.py
# recomputes every one), never by the procedure, then frozen here.
# expected_rows: [grain codes..., coverage in months, the unit stock and forecast are measured in on the QTY_EQ basis
# (kg or L; the coverage itself is always in months), stockout month]. graded_on: item_set (the exact set of products
# the answer gives), lowest_member (the member and its coverage).
held_out_questions:
  - id: H_LOCAL_STOCKOUT
    question: "As of June 2026, which items will stock out in at least one country within 3 months, while their stock across all countries covers more than 6 months?"
    # Two calls, then an intersection of the codes they return (never a computation on figures): item x country with
    # coverage_below 3, and items worldwide with coverage_above 6.
    queries:
      - {grain: [sku_code, country_code], filters: {}, basis: QTY_EQ, coverage_below: 3}
      - {grain: [sku_code], filters: {}, basis: QTY_EQ, coverage_above: 6}
    graded_on: item_set
    expected_items: [SKU-0001, SKU-0003, SKU-0008, SKU-0010, SKU-0011, SKU-0013, SKU-0014, SKU-0018, SKU-0021, SKU-0024, SKU-0031, SKU-0037, SKU-0038, SKU-0042]
    expected_calls:
      - {count: 32, stock: [{unit: L, amount: 73338.0}, {unit: kg, amount: 401131.0}], apart: {NO_STOCK: [[SKU-H08, NL], [SKU-H11, CH]], NO_DEMAND: [[SKU-H09, BE]]}}
      - {count: 36, stock: [{unit: L, amount: 731389.0}, {unit: kg, amount: 3281581.0}], apart: {NO_STOCK: [[SKU-H08], [SKU-H11]], NO_DEMAND: [[SKU-H09]]}}
    wrong:
      two_lists_without_intersection: 48   # products named when both lists are given
  - id: H_LOWEST_COUNTRY
    question: "Which country has the lowest stock coverage of breakfast cereals as of June 2026?"
    query: {grain: [country_code], filters: {family_code: BREAKFAST_CEREAL}, basis: QTY_EQ, rank_first: 1}
    graded_on: lowest_member
    expected_rows:
      - [PL, 2.1618732501908884, kg, "2026-09-01"]
    expected_apart: {NO_STOCK: [], NO_DEMAND: []}
    wrong:
      naive_mean_ratio_lowest: CH          # stock over the mean monthly forecast of the horizon puts CH lowest (1.83)
  - id: H_STOCKOUT_2027
    question: "As of June 2026, which items will stock out during 2027?"
