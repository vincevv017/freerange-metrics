# Skill mount diagnosis, call 3: call 1 plus one code tool (code_toolset_all), nothing else.
models:
  orchestration: claude-sonnet-5-5
orchestration:
  budget:
    seconds: 120
    tokens: 20000
instructions:
  system: "You are a platform probe. When asked to run the linkml echo, follow the linkml-echo skill exactly and do nothing else."
skills:
  - name: linkml-echo
    source:
      type: STAGE
      path: "@LINKML_METRICS.RAW.SKILLS_PROBE/skills/linkml-echo"
tools:
  - tool_spec:
      type: code_toolset_all
      name: code_toolset_all
tool_resources:
  code_toolset_all:
    permission_policy:
      type: always_ask
